{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background:linear-gradient(135deg,#1a3c5e 0%,#14304d 100%);">
  <div class="container"><div class="row justify-content-center"><div class="col-12 col-md-5">
    <div class="card border-0 shadow-lg rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-envelope-open text-primary fs-1"></i>
          <h4 class="fw-bold mt-2">Forgot Password?</h4>
          <p class="text-muted small">Enter your email and we will send you a reset link.</p>
        </div>
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-4">
            <label class="form-label fw-semibold">Email Address</label>
            {{ form.email }}
            {% if form.email.errors %}<div class="text-danger small mt-1">{{ form.email.errors.0 }}</div>{% endif %}
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-send me-2"></i>Send Reset Link</button>
          </div>
        </form>
        <div class="text-center mt-3">
          <a href="{% url 'accounts:login' %}" class="text-primary small"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
        </div>
      </div>
    </div>
  </div></div></div>
</div>
{% endblock %}

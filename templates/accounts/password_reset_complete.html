{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background:linear-gradient(135deg,#1a3c5e 0%,#14304d 100%);">
  <div class="col-12 col-md-5">
    <div class="card border-0 shadow-lg rounded-4 text-center p-5">
      <i class="bi bi-check-circle text-success fs-1"></i>
      <h4 class="fw-bold mt-3">Password Reset Complete</h4>
      <p class="text-muted">Your password has been set. You can now log in.</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">Go to Login</a>
    </div>
  </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; max-width: 600px;
             margin: 0 auto; padding: 20px;">
    <div style="background: #1a3c5e; padding: 20px;
                border-radius: 8px 8px 0 0; text-align: center;">
        <h2 style="color: white; margin: 0;">Smart Mall System</h2>
    </div>
    <div style="background: #ffffff; padding: 30px;
                border: 1px solid #e0e0e0;">
        <p>Hello <strong>{{ user.get_full_name }}</strong>,</p>
        <p>We received a request to reset your password.
           Click the button below to set a new one:</p>
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}"
               style="background: #1a3c5e; color: white;
                      padding: 14px 30px; border-radius: 6px;
                      text-decoration: none; font-weight: bold;">
                Reset My Password
            </a>
        </div>
        <p style="color: #666; font-size: 13px;">
            This link expires in 24 hours. If you did not request
            a password reset, ignore this email.
        </p>
    </div>
    <div style="background: #f8f8f8; padding: 15px;
                text-align: center; font-size: 12px; color: #999;
                border-radius: 0 0 8px 8px;">
        Smart Mall Rental Management System
    </div>
</body>
</html>

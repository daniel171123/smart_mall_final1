{% extends 'base.html' %}
{% block title %}Email Sent{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background:linear-gradient(135deg,#1a3c5e 0%,#14304d 100%);">
  <div class="col-12 col-md-5">
    <div class="card border-0 shadow-lg rounded-4 text-center p-5">
      <i class="bi bi-envelope-check text-success fs-1"></i>
      <h4 class="fw-bold mt-3">Check Your Email</h4>
      <p class="text-muted">If that email exists in our system, a password reset link has been sent.</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}

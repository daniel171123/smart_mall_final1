<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>{% block title %}Smart Mall{% endblock %} | Smart Mall</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root {
  --primary:    #1a3c5e;
  --primary-dk: #14304d;
  --accent:     #f0a500;
  --sidebar-w:  260px;
}
*   { box-sizing: border-box; }
body {
  background: #f0f2f5;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  font-size: 14px;
}

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w);
  height: 100vh;
  background: var(--primary);
  position: fixed;
  top: 0; left: 0;
  z-index: 1050;
  transition: transform .28s cubic-bezier(.4,0,.2,1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 4px 0 16px rgba(0,0,0,.18);
}
#sidebar .brand {
  padding: 20px 20px 14px;
  border-bottom: 1px solid rgba(255,255,255,.1);
  flex-shrink: 0;
}
#sidebar .brand h5 {
  color: #fff; font-weight: 700;
  font-size: 16px; margin: 0;
  letter-spacing: .3px;
}
#sidebar .brand small { color: #a0c0e0; font-size: 12px; }
#sidebar-nav {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.2) transparent;
  padding-bottom: 40px;
}
#sidebar-nav::-webkit-scrollbar       { width: 3px; }
#sidebar-nav::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.2);
  border-radius: 4px;
}
.nav-label {
  color: rgba(255,255,255,.38);
  font-size: 10px; font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  padding: 16px 20px 4px;
}
.sidebar-link {
  display: flex;
  align-items: center;
  gap: 10px;
  color: rgba(255,255,255,.72);
  padding: 10px 16px;
  border-radius: 8px;
  margin: 2px 8px;
  font-size: 13.5px;
  text-decoration: none;
  transition: background .18s, color .18s;
  cursor: pointer;
  border: none;
  background: none;
  width: calc(100% - 16px);
  text-align: left;
}
.sidebar-link i { font-size: 16px; width: 20px; flex-shrink: 0; }
.sidebar-link:hover,
.sidebar-link.active {
  background: rgba(255,255,255,.13);
  color: #fff;
}
.sidebar-link.active {
  background: rgba(240,165,0,.22);
  color: #f0a500;
  font-weight: 600;
}
.sidebar-link.active i { color: #f0a500; }
#scroll-indicator {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(transparent, rgba(0,0,0,.3));
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 4px;
  cursor: pointer;
  z-index: 2;
}

/* ── Main ── */
#main { margin-left: var(--sidebar-w); min-height: 100vh; }
.topbar {
  background: #fff;
  padding: 10px 24px;
  border-bottom: 1px solid #e4e8ed;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 999;
  box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
.topbar .page-title {
  font-size: 17px; font-weight: 700;
  color: var(--primary); margin: 0;
}
.content-area { padding: 24px; }

/* ── Cards ── */
.metric-card {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
  transition: transform .2s, box-shadow .2s;
  text-decoration: none;
  display: block;
  color: inherit;
  height: 100%;
}
.metric-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,.1);
  color: inherit;
}
.metric-card .icon-box {
  width: 48px; height: 48px;
  border-radius: 12px;
  display: flex; align-items: center;
  justify-content: center;
  font-size: 20px;
}
.metric-card .value {
  font-size: 26px; font-weight: 700;
  color: var(--primary); line-height: 1.1;
}
.metric-card .label { font-size: 12px; color: #6c757d; margin-top: 2px; }

/* ── Table cards ── */
.table-card {
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
  overflow: hidden;
}
.table-card .card-header {
  background: #fff;
  padding: 14px 20px;
  border-bottom: 1px solid #f0f2f5;
  font-weight: 700; color: var(--primary);
  font-size: 14px;
}
.table th {
  background: #f8f9fa; font-size: 11px;
  font-weight: 700; text-transform: uppercase;
  letter-spacing: .5px; color: #6c757d; border: none;
}
.table td { vertical-align: middle; font-size: 13px; }
.table tbody tr:hover { background: #f8f9ff; }

/* ── Badges ── */
.badge-unpaid    { background:#fff3cd; color:#856404; }
.badge-paid      { background:#d1edde; color:#155724; }
.badge-overdue   { background:#f8d7da; color:#721c24; }
.badge-active    { background:#d1edde; color:#155724; }
.badge-expired   { background:#e2e3e5; color:#383d41; }
.badge-terminated{ background:#f8d7da; color:#721c24; }

/* ── Notification bell ── */
.notif-bell {
  position: relative; cursor: pointer;
}
.notif-badge {
  position: absolute; top: -4px; right: -4px;
  background: #dc3545; color: #fff;
  border-radius: 50%; width: 18px; height: 18px;
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center;
  justify-content: center;
  border: 2px solid #fff;
}
.notif-dropdown {
  width: 340px; max-height: 420px;
  overflow-y: auto;
  border-radius: 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,.15);
  border: 1px solid #eee;
}
.notif-item {
  padding: 10px 16px;
  border-bottom: 1px solid #f5f5f5;
  font-size: 12px;
  transition: background .15s;
}
.notif-item:hover { background: #f8f9ff; }
.notif-item .notif-title { font-weight: 600; color: #212529; }
.notif-item .notif-time  { color: #aaa; font-size: 11px; }
.notif-item .notif-type  {
  font-size: 10px; padding: 2px 6px;
  border-radius: 4px; font-weight: 600;
}

/* ── Toast ── */
.toast-container {
  position: fixed; top: 20px; right: 20px; z-index: 9999;
  max-width: 340px;
}

/* ── Overlay ── */
#sidebar-overlay {
  display: none;
  position: fixed; top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,.5);
  z-index: 1040;
  backdrop-filter: blur(2px);
}

/* ── Scroll-to-top ── */
#scroll-top-btn {
  position: fixed; bottom: 28px; right: 28px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--primary); color: #fff;
  border: none;
  box-shadow: 0 4px 14px rgba(0,0,0,.25);
  cursor: pointer;
  display: none;
  align-items: center; justify-content: center;
  font-size: 18px; z-index: 998;
  transition: transform .2s, box-shadow .2s;
}
#scroll-top-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(0,0,0,.3);
}

/* ── Responsive ── */
@media (max-width: 991.98px) {
  #sidebar { transform: translateX(-100%); }
  #sidebar.show { transform: translateX(0); }
  #main { margin-left: 0; }
}
@media (max-width: 767.98px) {
  .content-area { padding: 14px; }
  .topbar { padding: 10px 14px; }
  .topbar .page-title { font-size: 15px; }
  .metric-card .value { font-size: 22px; }
  .table-responsive { font-size: 12px; }
  .notif-dropdown { width: 300px; }
}
@media (max-width: 575.98px) {
  #sidebar { width: 88vw; }
  .content-area { padding: 10px; }
  .metric-card { padding: 14px; }
  h5.mb-0 { font-size: 14px; }
}
@media (min-width: 1400px) {
  .content-area { padding: 32px; }
}

/* ── Form improvements ── */
.form-control, .form-select {
  border-radius: 8px;
  border: 1px solid #dde2ec;
  font-size: 14px;
  padding: 9px 14px;
  transition: border-color .2s, box-shadow .2s;
}
.form-control:focus, .form-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(26,60,94,.12);
}
.btn {
  border-radius: 8px;
  font-weight: 500;
  font-size: 13px;
  padding: 8px 16px;
}
.btn-primary {
  background: var(--primary);
  border-color: var(--primary);
}
.btn-primary:hover {
  background: var(--primary-dk);
  border-color: var(--primary-dk);
}

/* ── Page header utility ── */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.page-header h5 {
  margin: 0;
  font-weight: 700;
  color: var(--primary);
}

/* ── Animations ── */
@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(5px); }
}
@keyframes fadeIn {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}
.fade-in { animation: fadeIn .3s ease forwards; }
</style>
{% block extra_css %}{% endblock %}
</head>
<body>
  <!-- Anti-flash: hide body until translation applied -->
<style id="anti-flash">body{opacity:0!important;}</style>
<script>
// Run BEFORE any rendering
(function(){
  const lang = localStorage.getItem('lang');
  if (lang === 'am') {
    // Keep body hidden — translatePage() will show it
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        const s = document.getElementById('anti-flash');
        if (s) s.remove();
      }, 200);
    });
  } else {
    // English — show immediately
    document.addEventListener('DOMContentLoaded', function() {
      const s = document.getElementById('anti-flash');
      if (s) s.remove();
    });
  }
})();
</script>
{% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
  document.querySelectorAll('.toast').forEach(el => {
    setTimeout(() => el.classList.remove('show'), 4500);
  });
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
